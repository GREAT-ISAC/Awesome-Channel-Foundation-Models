name: Propose a catalog resource
description: Suggest a paper, dataset, pretrained model, benchmark project, or simulation tool.
title: "[Resource]: "
labels: [catalog-proposal]
body:
  - type: markdown
    attributes:
      value: Please read the inclusion criteria and provide primary, verifiable sources. Do not submit guessed links.
  - type: dropdown
    id: kind
    attributes:
      label: Resource type
      options:
        - Paper
        - Dataset
        - Pretrained model
        - Benchmark project
        - Simulation tool
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name or paper title
      placeholder: Full, canonical title
    validations:
      required: true
  - type: input
    id: primary_url
    attributes:
      label: Primary URL
      description: Paper page, author/institution repository, official model or dataset card, or official tool page.
      placeholder: https://
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Proposed scope
      options:
        - Core CFM
        - Broader Wireless/Radio FM
        - Related Method
        - Unsure
    validations:
      required: true
  - type: textarea
    id: relevance
    attributes:
      label: CFM relevance
      description: Explain the reusable pretraining, channel-related tasks, or infrastructure contribution.
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Associated resources
      description: List code, datasets, checkpoints, benchmark projects, or simulation tools and state whether each is official or community-maintained.
      placeholder: One URL and provenance claim per line
  - type: input
    id: license
    attributes:
      label: License or access terms
      description: State the published license or write "not stated"; do not infer one.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Verification
      options:
        - label: I checked the primary URL and provenance before submitting.
          required: true
        - label: I have disclosed any restricted access or community-maintained links.
          required: true
