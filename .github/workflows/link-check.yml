name: External link audit

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-link-audit
  cancel-in-progress: false

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit external links without changing catalog data
        run: python scripts/catalog.py check-links --report link-report.json --max-indeterminate-rate 0.5
      - name: Upload link audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfm-link-audit
          path: link-report.json
          if-no-files-found: warn
          retention-days: 30
