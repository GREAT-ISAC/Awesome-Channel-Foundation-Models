name: Catalog maintenance audits

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-maintenance-audits
  cancel-in-progress: false

jobs:
  audit-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Report catalog verification freshness
        run: python scripts/catalog.py check-freshness --report freshness-report.json
      - name: Audit external links without changing catalog data
        run: python scripts/catalog.py check-links --report link-report.json --max-indeterminate-rate 0.5
      - name: Upload maintenance audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfm-maintenance-audits
          path: |
            freshness-report.json
            link-report.json
          if-no-files-found: warn
          retention-days: 30
