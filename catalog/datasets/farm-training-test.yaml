id: farm-training-test
name: FARM Training and Evaluation Datasets
description: The currently released ARM-Omni-derived subsets for FARM training, in-domain evaluation, and zero-shot tests; the authors state that a fuller ARM-Omni release is planned.
scope: cfm-ecosystem
