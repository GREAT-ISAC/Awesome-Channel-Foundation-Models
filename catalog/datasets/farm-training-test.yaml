tasks: [radio-map-generation, radio-map-estimation]
specifications:
  version: null
  scale: 13 released configuration groups (D1-D10, P1, F1, and A1), each listed at volume 15,000
  download_size: 210 GB
  frequency_bands: [2.1 GHz, 2.6 GHz, 3.3 GHz, 3.5 GHz, 4.9 GHz, 5.9 GHz, 7.1 GHz]
  scenarios: [D1-D10 in-domain configurations, P1 spatial transfer, F1 cross-frequency transfer, A1 antenna-pattern transfer]
